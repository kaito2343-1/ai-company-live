name: "AI会社：実績を記録"
on:
  issues:
    types: [opened, edited]
permissions:
  contents: write
  issues: read
concurrency:
  group: ai-company-activity-log
  cancel-in-progress: false
jobs:
  append:
    # 第三者がIssueを作成しても公開データは書き換えない
    if: github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, '[実績]')
    runs-on: ubuntu-latest
    steps:
      - name: Check out current default branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: ${{ github.event.repository.default_branch }}
      - name: Parse owner-authored form and update activity.json
        run: python3 scripts/append_activity.py
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          ACTIVITY_FILE: activity.json
      - name: Commit public log (only when changed)
        run: |
          if git diff --quiet -- activity.json; then
            echo '活動記録に変更なし'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add activity.json
          git commit -m "log: update AI company activity #${{ github.event.issue.number }}"
          git push origin HEAD:${{ github.event.repository.default_branch }}
